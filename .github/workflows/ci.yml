name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 3

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require linear pull-request commits
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $mergeCommits = @(git rev-list --min-parents=2 "$env:BASE_SHA..$env:HEAD_SHA")
          if ($mergeCommits.Count -gt 0) {
            Write-Error "Pull-request commits must be linear. Rebase onto main instead of merging main into the branch."
            exit 1
          }

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore WhatsAppChatViewer.slnx

      - name: Build
        run: dotnet build WhatsAppChatViewer.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test WhatsAppChatViewer.slnx --configuration Release --no-build
